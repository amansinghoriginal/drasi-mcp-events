<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="-apple-system, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="mDark4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="560" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="34" font-size="16" font-weight="700" fill="#111827">The event with no write at all</text>
  <text x="40" y="52" font-size="11" fill="#9ca3af">stuck-orders.changed&#160;&#160;·&#160;&#160;<tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace">drasi.trueFor(o.status = 'open', duration({ seconds: 45 }))</tspan></text>

  <!-- axis -->
  <line x1="80" y1="360" x2="1005" y2="360" stroke="#334155" stroke-width="2" marker-end="url(#mDark4)"/>
  <text x="1008" y="384" font-size="11" fill="#6b7280" text-anchor="end">time</text>

  <g id="s1">
    <!-- the single write -->
    <rect x="120" y="150" width="250" height="46" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="245" y="169" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#334155" text-anchor="middle">INSERT orders (leo, $300)</text>
    <text x="245" y="186" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#94a3b8" text-anchor="middle">status = 'open'</text>
    <line x1="245" y1="196" x2="245" y2="352" stroke="#cbd5e1" stroke-width="1.25"/>
    <circle cx="245" cy="360" r="4.5" fill="#334155"/>
    <text x="245" y="384" font-size="11" fill="#6b7280" text-anchor="middle">12:00:00</text>

    <!-- the quiet stretch -->
    <text x="502" y="298" font-size="12.5" font-style="italic" fill="#b0b7c3" text-anchor="middle">nothing happens — no writes, no polls, no cron</text>
    <line x1="245" y1="410" x2="760" y2="410" stroke="#cbd5e1" stroke-width="1.25" stroke-dasharray="5 4"/>
    <line x1="245" y1="404" x2="245" y2="416" stroke="#cbd5e1" stroke-width="1.25"/>
    <line x1="760" y1="404" x2="760" y2="416" stroke="#cbd5e1" stroke-width="1.25"/>
    <text x="502" y="432" font-size="11" fill="#94a3b8" text-anchor="middle">45 seconds of continuously 'open'</text>
  </g>

  <g id="s2">
    <!-- the fire -->
    <line x1="760" y1="356" x2="760" y2="238" stroke="#dc2626" stroke-width="2.5"/>
    <circle cx="760" cy="234" r="6" fill="#dc2626"/>
    <text x="760" y="204" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">&#9889; event: added</text>
    <text x="760" y="222" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#ef4444" text-anchor="middle">stuck-orders.changed { leo }</text>
    <text x="760" y="384" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">12:00:45</text>

    <!-- callout -->
    <rect x="806" y="120" width="238" height="76" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="925" y="144" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">the condition became true</text>
    <text x="925" y="162" font-size="11" fill="#dc2626" text-anchor="middle">“open for 45 seconds straight”</text>
    <text x="925" y="178" font-size="11" fill="#dc2626" text-anchor="middle">no one touched the database</text>
    <path d="M 806 168 C 782 190, 770 210, 762 230" fill="none" stroke="#fca5a5" stroke-width="1.25" stroke-dasharray="4 4"/>

    <text x="540" y="508" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">no cron job anywhere — the continuous query watches time itself</text>
  </g>

  <g id="s3">
    <!-- the unstuck bonus -->
    <rect x="838" y="238" width="196" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="936" y="256" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#334155" text-anchor="middle">UPDATE orders SET</text>
    <text x="936" y="272" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#334155" text-anchor="middle">status = 'shipped'</text>
    <line x1="920" y1="282" x2="920" y2="352" stroke="#cbd5e1" stroke-width="1.25"/>
    <circle cx="920" cy="360" r="4.5" fill="#64748b"/>
    <text x="920" y="384" font-size="11" fill="#6b7280" text-anchor="middle">12:01:02</text>
    <rect x="845" y="310" width="150" height="26" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.25"/>
    <text x="920" y="327" font-size="10.5" font-weight="600" fill="#64748b" text-anchor="middle">deleted — “unstuck”</text>
  </g>
</svg>
