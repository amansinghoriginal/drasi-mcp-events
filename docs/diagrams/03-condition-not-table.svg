<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 656" font-family="-apple-system, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="mBlue3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="mRed3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="mIndigo3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="656" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="34" font-size="16" font-weight="700" fill="#111827">A stream is a condition — not a table</text>
  <text x="40" y="52" font-size="11" fill="#9ca3af">high-value-orders.changed&#160;&#160;·&#160;&#160;<tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace">MATCH (o:orders) WHERE o.total &gt; 1000</tspan></text>

  <!-- boundary tag -->
  <rect x="465" y="88" width="150" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.25"/>
  <text x="540" y="105" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#475569" text-anchor="middle">total &gt; 1000</text>

  <!-- result-set region + boundary -->
  <rect x="560" y="122" width="460" height="416" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <line x1="540" y1="114" x2="540" y2="538" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="790" y="148" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">IN THE RESULT SET</text>
  <text x="790" y="164" font-size="10.5" fill="#60a5fa" text-anchor="middle">the only world the stream can see</text>
  <text x="300" y="148" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">OUTSIDE</text>
  <text x="300" y="164" font-size="10.5" fill="#b0b7c3" text-anchor="middle">invisible to the stream</text>

  <!-- standing rows -->
  <rect x="170" y="188" width="170" height="38" rx="9" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.25"/>
  <text x="255" y="212" font-size="12" fill="#334155" text-anchor="middle"><tspan font-weight="600">bob</tspan> — $250</text>
  <rect x="170" y="242" width="170" height="38" rx="9" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.25"/>
  <text x="255" y="266" font-size="12" fill="#334155" text-anchor="middle"><tspan font-weight="600">dave</tspan> — $999.99</text>

  <rect x="650" y="188" width="170" height="38" rx="9" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.25"/>
  <text x="735" y="212" font-size="12" fill="#1e40af" text-anchor="middle"><tspan font-weight="600">alice</tspan> — $1,500</text>
  <rect x="650" y="242" width="170" height="38" rx="9" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.25"/>
  <text x="735" y="266" font-size="12" fill="#1e40af" text-anchor="middle"><tspan font-weight="600">carol</tspan> — $2,200</text>

  <g id="s2">
    <!-- added -->
    <rect x="170" y="330" width="170" height="38" rx="9" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.25"/>
    <text x="255" y="354" font-size="12" fill="#334155" text-anchor="middle"><tspan font-weight="600">ivy</tspan> — $7,200</text>
    <line x1="350" y1="349" x2="638" y2="349" stroke="#2563eb" stroke-width="1.75" marker-end="url(#mBlue3)"/>
    <rect x="497" y="332" width="86" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.25"/>
    <text x="540" y="348" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">added</text>
    <rect x="650" y="330" width="170" height="38" rx="9" fill="none" stroke="#93c5fd" stroke-width="1.25" stroke-dasharray="4 3"/>
    <text x="735" y="354" font-size="12" fill="#60a5fa" text-anchor="middle"><tspan font-weight="600">ivy</tspan> — $7,200</text>
    <text x="255" y="386" font-size="10.5" fill="#9ca3af" text-anchor="middle">an INSERT — a row enters the set</text>

    <!-- updated -->
    <rect x="700" y="404" width="96" height="24" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.25"/>
    <text x="748" y="420" font-size="11" font-weight="700" fill="#4f46e5" text-anchor="middle">updated</text>
    <rect x="640" y="436" width="216" height="36" rx="9" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.25"/>
    <text x="748" y="459" font-size="11.5" fill="#3730a3" text-anchor="middle"><tspan font-weight="600">nina</tspan> — $8,700 &#8594; $9,100</text>
    <text x="748" y="480" font-size="10.5" fill="#9ca3af" text-anchor="middle">an UPDATE that stays inside — before and after included</text>
  </g>

  <g id="s3">
    <!-- deleted -->
    <rect x="700" y="486" width="170" height="36" rx="9" fill="none" stroke="#fecaca" stroke-width="1.25" stroke-dasharray="4 3"/>
    <text x="785" y="509" font-size="11.5" fill="#ef4444" text-anchor="middle"><tspan font-weight="600">ivy</tspan> — now $400</text>
    <line x1="692" y1="504" x2="350" y2="504" stroke="#dc2626" stroke-width="2.25" marker-end="url(#mRed3)"/>
    <rect x="497" y="487" width="86" height="24" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.25"/>
    <text x="540" y="503" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">deleted</text>
    <text x="300" y="530" font-size="10.5" fill="#9ca3af" text-anchor="middle">(the stream stops seeing ivy)</text>

    <!-- punchline -->
    <rect x="60" y="556" width="330" height="58" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="225" y="580" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">this was a SQL UPDATE</text>
    <text x="225" y="598" font-size="11" fill="#dc2626" text-anchor="middle">the row didn’t die — the condition stopped being true</text>
    <path d="M 260 556 C 280 534, 300 520, 330 508" fill="none" stroke="#fca5a5" stroke-width="1.25" stroke-dasharray="4 4"/>
  </g>

  <!-- footer plumbing -->
  <text x="540" y="642" font-size="11" fill="#9ca3af" text-anchor="middle">Postgres &#8594; WAL &#8594; Drasi continuous query &#8594; MCP Events server&#160;&#160;&#160;&#160;<tspan fill="#b0b7c3" font-style="italic">the agent never sees this plumbing — it just gets added / updated / deleted</tspan></text>
</svg>
